<script>
DataStore.data().then(DATA => {
  renderLatestUpdate(DATA);
  const rowsCsv = (rows) => rows;
  document.getElementById('dlGamesCsv').addEventListener('click', () => {
    const f = ['game','opportunity_score','potential_score','avg_viewers','viewers_per_streamer','avg_concurrent_streamers','growth_pct','confidence','unique_streamers_seen','samples','best_day_utc','best_hour_utc','best_day_local','best_hour_local'];
    GRDownload.saveCsv([f, ...DATA.games.map(g => f.map(k => g[k] ?? ''))], 'green-room-games.csv');
  });
  document.getElementById('dlHeatCsv').addEventListener('click', () => {
    const rows = [['region','clock','day','hour','viewers_per_streamer','n_snapshots','avg_streamers','avg_viewers']];
    const S = DATA.schedule || {};
    const regions = { ALL: S, ...(S.by_country || {}) };
    Object.entries(regions).forEach(([region, block]) => {
      [['standardized','UTC'],['time_of_day','streamer-local']].forEach(([mode, clock]) => {
        ((block[mode] || {}).heatmap || []).forEach(c => rows.push([region, clock, c.day, c.hour, c.ratio, c.n, c.streamers, c.viewers]));
      });
    });
    GRDownload.saveCsv(rows, 'green-room-day-hour.csv');
  });
});
</script>
