<!DOCTYPE html>
<html lang="en" data-title-key="ins.title">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Analysis — Green Room</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="brand-dot"></span> Green Room</div>
    <nav class="topnav">
      <a href="index.html" data-i18n="nav.overview">Overview</a>
      <a href="games.html" data-i18n="nav.games">Call Sheet</a>
      <a href="schedule.html" data-i18n="nav.board">Signal Board</a>
      <a href="insights.html" data-i18n="nav.analysis">Deep Analysis</a>
      <a href="about.html" data-i18n="nav.about">About Us</a>
    </nav>
    <div class="topbar-meta mono" id="topbarMeta" data-i18n="common.loading">loading&hellip;</div>
    <div class="zoom-control" id="siteZoomControl"></div>
    <div class="theme-toggle-wrap" id="themeToggleControl"></div>
  </div>

  <section class="section" style="border-top:none; padding-top:36px;">
    <div class="section-head">
      <div>
        <h2 data-i18n="ins.h2">Deep analysis</h2>
        <p data-i18n="ins.p"></p>
      </div>
    </div>

    <details class="newbie-guide" open>
      <summary><span class="newbie-badge" data-i18n="ins.guide.badge">New here?</span> <span data-i18n="ins.guide.summary">Start with these 4 charts</span></summary>
      <p class="newbie-lead" data-i18n-html="ins.guide.lead"></p>
      <ol class="newbie-steps">
        <li><button type="button" class="newbie-jump" data-jump="q2" data-i18n="ins.guide.1b"></button> <span data-i18n-html="ins.guide.1t"></span></li>
        <li><button type="button" class="newbie-jump" data-jump="q7" data-i18n="ins.guide.2b"></button> <span data-i18n-html="ins.guide.2t"></span></li>
        <li><button type="button" class="newbie-jump" data-jump="q5" data-i18n="ins.guide.3b"></button> <span data-i18n-html="ins.guide.3t"></span></li>
        <li><button type="button" class="newbie-jump" data-jump="distribution" data-i18n="ins.guide.4b"></button> <span data-i18n-html="ins.guide.4t"></span></li>
      </ol>
      <p class="newbie-more" id="newbieMore"></p>
      <p class="newbie-tip" data-i18n-html="ins.guide.tip"></p>
    </details>

    <div class="period-controls" id="periodControls">
      <div class="period-select-group">
        <label for="yearSelect" data-i18n="ins.year">Year</label>
        <select id="yearSelect"></select>
      </div>
      <div class="period-select-group">
        <label for="monthSelect" data-i18n="ins.month">Month</label>
        <select id="monthSelect"></select>
      </div>
      <div class="period-select-group">
        <label for="weekSelect" data-i18n="ins.week">Week</label>
        <select id="weekSelect"><option value="ALL" data-i18n="ins.all_weeks">All weeks</option></select>
      </div>
      <div class="period-select-group">
        <label for="daySelect" data-i18n="ins.day">Day</label>
        <select id="daySelect"><option value="ALL" data-i18n="ins.all_days">All days</option></select>
      </div>
      <div class="period-current mono" id="periodCurrent"></div>
    </div>
    <div class="start-note" id="timingStartNote"></div>
    <div class="game-filter-chip" id="gameFilterChip" style="display:none;"></div>
    <p class="filter-hint" data-i18n="ins.filter_hint"></p>
    <div id="insightBlocksPre"></div>

    <div class="timing-section">
      <div class="timing-head">
        <h3 data-i18n="ins.timing_h">Timing signals</h3>
        <p data-i18n="ins.timing_p"></p>
      </div>
      <div class="period-controls">
        <div class="period-select-group">
          <label for="timingTimezoneSelect" data-i18n="ins.tz">Timezone</label>
          <select id="timingTimezoneSelect">
            <option value="standardized" data-i18n="ins.tz.utc">Standardized (UTC)</option>
            <option value="time_of_day" data-i18n="ins.tz.local">Local time-of-day</option>
          </select>
        </div>
        <div class="period-select-group">
          <label for="timingCountrySelect" data-i18n="ins.region">Region</label>
          <select id="timingCountrySelect"></select>
        </div>
      </div>
      <p class="filter-hint" id="timingRegionNote" data-i18n="ins.region_note"></p>
      <div class="timing-charts" id="timingCharts"></div>
    </div>

    <div id="insightBlocksPost"></div>
  </section>

  <footer>
    <p class="copyright" data-i18n="common.copyright">&copy; PSU Phuket</p>
  </footer>
</div>

<script src="js/lang/en.js"></script>
<script src="js/lang/th.js"></script>
<script src="js/lang/es.js"></script>
<script src="js/lang/de.js"></script>
<script src="js/i18n.js"></script>
<script src="js/download.js"></script>
<script src="js/common.js"></script>
<script src="js/insights.js"></script>
</body>
</html>
