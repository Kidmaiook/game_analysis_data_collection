name: Sync Multiple Folders from Main to Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data'

jobs:
  sync-to-web:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout Web Branch and Sync Folders
        run: |
          git checkout Web_secend_edition
          git checkout main -- data
          
          if [ -n "$(git status --porcelain)" ]; then
            git add data
            git commit -m "chore: auto-sync multiple folders from main branch [skip ci]"
            git push origin Web_secend_edition
          else
            echo "No changes to commit."
          fi
